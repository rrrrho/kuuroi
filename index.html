<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070405" />
    <meta
      name="description"
      content="Kuuroi — atelier de arte gótico, pinturas e ilustraciones realistas."
    />
    <title>Kuuroi — Atelier de arte gótico</title>
  </head>
  <body>
    <form
      name="commission-request"
      method="POST"
      enctype="multipart/form-data"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="commission-request" />
      <input type="hidden" name="subject" value="Nueva consulta desde KUUROI" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="inquiry_type">
        <option value="adquisicion">Adquisición de Lienzo al Óleo</option>
        <option value="comision">Comisión personalizada</option>
        <option value="informacion">Información sobre una obra</option>
      </select>
      <input type="text" name="artwork_reference" />
      <textarea name="details"></textarea>
      <input type="file" name="reference_image_1" />
      <input type="file" name="reference_image_2" />
      <input type="file" name="reference_image_3" />
      <input type="file" name="reference_image_4" />
      <input type="file" name="reference_image_5" />
      <input type="file" name="reference_image_6" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
